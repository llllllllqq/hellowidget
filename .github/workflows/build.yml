name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:      # 支持手动触发

permissions:
  contents: write         # 允许创建 GitHub Release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.5"

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > hello-release.keystore

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Build Release APK (signed)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-signed
          path: app/build/outputs/apk/release/app-release.apk

      # 推送 main 分支成功后，自动发布一个可下载的 Release（带签名 APK）
      - name: Create GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v5.7.${{ github.run_number }}
          name: HelloWidget v5.7（小部件单条渲染：行高正常 + 任意位置可点击）· build ${{ github.run_number }}
          body: |
            ## 本版本改进
            ### 小部件渲染优化
            - **整段内容单条渲染**：改为单个列表项 + TextView 自动软换行，行高恢复正常，不再有被拉高的巨行
            - 内容长 → 单项自动超高 → 原生滚动阅读；内容短 → 单项按小组件高度补高 → 整块任意位置可点击
            - 填充逻辑简化：只需小组件报告高度，不再逐行估算行高
            - 填充仅在渲染时计算，不影响存储内容和编辑器显示
            ### 历史功能
            - 失焦即保存并弹 Toast（Home/多任务键/切应用）
            - DataStore 官方原子写入 + CRC32 校验
            - 小组件外观设置（字体/颜色/背景）
            - 零后台占用
          files: app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
