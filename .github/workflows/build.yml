name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:      # 支持手动触发

permissions:
  contents: write         # 允许创建 GitHub Release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.5"

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > hello-release.keystore

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Build Release APK (signed)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-signed
          path: app/build/outputs/apk/release/app-release.apk

      # 推送 main 分支成功后，自动发布一个可下载的 Release（带签名 APK）
      - name: Create GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v5.8.${{ github.run_number }}
          name: HelloWidget v5.8（修复短内容误滚动 + 可调防误触余量）· build ${{ github.run_number }}
          body: |
            ## 本版本改进
            ### 修复
            - **修复短内容时小组件误滚动半行**：内边距 8dp 从 ListView 移到列表项内部，列表可视区 = 完整高度，不再因内边距产生滚动余量
            - **防误触余量可设置**（设置页新增，默认 4dp，0–20dp）：短内容时从小组件高度扣除该余量，抵消桌面取整误差；余量越大越不易误滚动，底部留白略增
            ### 历史功能
            - 整段内容单条渲染：行高正常、长内容滚动、短内容整块可点击
            - 失焦即保存并弹 Toast（Home/多任务键/切应用）
            - DataStore 官方原子写入 + CRC32 校验
            - 小组件外观设置（字体/颜色/背景）
            - 零后台占用
          files: app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
