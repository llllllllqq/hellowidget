name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:      # 支持手动触发

permissions:
  contents: write         # 允许创建 GitHub Release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.5"

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > hello-release.keystore

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Build Release APK (signed)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-signed
          path: app/build/outputs/apk/release/app-release.apk

      # 推送 main 分支成功后，自动发布一个可下载的 Release（带签名 APK）
      - name: Create GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v5.6.${{ github.run_number }}
          name: HelloWidget v5.6（修复MIUI加载 + 空白区可点击 + 失焦即保存）· build ${{ github.run_number }}
          body: |
            ## 本版本改进
            ### 修复（重要）
            - **修复 MIUI 小部件再次无法加载**：彻底移除 ScrollView 方案，回归 ListView 逐行渲染（该方案在 MIUI 已验证可正常加载）
            - **小部件空白区域可点击**：内容不满一页时，最后一行列表项按小组件实际高度（getAppWidgetOptions）自动补齐高度，覆盖整个空白区；ListView 行间无缝隙不会漏点；填充仅在渲染时计算，编辑器/存储内容不受影响
            - **失焦即保存并弹 Toast**：改为 onWindowFocusChanged 监听，Home / 多任务键 / 切应用 / 下拉通知栏等任何失焦都会同步保存并弹「已保存 ✓」（应用内跳转与旋转除外）
            ### 历史功能
            - 包名 moe.hellowidget；返回键退出先存后退
            - DataStore 官方原子写入 + CRC32 校验
            - 小组件外观设置（字体/颜色/背景）
            - 零后台占用
          files: app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
