name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:      # 支持手动触发

permissions:
  contents: write         # 允许创建 GitHub Release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.5"

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > hello-release.keystore

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Build Release APK (signed)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-signed
          path: app/build/outputs/apk/release/app-release.apk

      # 推送 main 分支成功后，自动发布一个可下载的 Release（带签名 APK）
      - name: Create GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v5.2.${{ github.run_number }}
          name: HelloWidget v5.2（Home/多任务键提示 + 应用图标 + 改名）· build ${{ github.run_number }}
          body: |
            ## 本版本改进
            - **Home / 多任务键 / 切到其他应用时也会弹出「已保存 ✓」Toast**（应用内跳转与旋转仍静默保存）
            - **新增应用图标**：Material Symbols「widgets」开源图标（Apache 2.0），紫底白栅格，适配自适应图标与旧版设备
            - **项目改名 hellowidget**（Gradle 项目名 + GitHub 仓库名）
            ### 历史功能
            - 返回键退出：先原子写盘 → 确认后 Toast → 再退出
            - DataStore 官方原子写入 + CRC32 校验，仅退出/返回/切后台时保存
            - 桌面小组件列表式可滚动 + 外观设置（字体/颜色/背景）
            - 零后台占用，保存完成即结束
          files: app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
