name: Build & Release

# 唯一的 CI 流水线：质量门禁 → 构建 APK → 发布 GitHub Release。
# 所有编译、静态分析、单元测试都在这里完成；本地无需安装任何工具链。
on:
  push:
    branches: [ "main", "qa/**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

# 默认只读；只有 release job 单独申请 contents: write（最小权限原则）
permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ---------- 1. 质量门禁：Lint + JVM 单元测试 ----------
  quality:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: "17"
          distribution: "temurin"

      # 不使用 android-actions/setup-android@v3：该 action 现已因
      # sdkmanager 报 "Failed to find package 'tools'" 而必然失败。
      # runner 镜像自带 Android SDK，直接复用即可，还少一个可变 tag 的第三方依赖。
      - name: Resolve preinstalled Android SDK
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK" ]; then echo "::error::Android SDK not found at $SDK"; exit 1; fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "sdk.dir=$SDK" > local.properties
          echo "Resolved ANDROID_HOME=$SDK"

      - name: Set up Gradle (from committed wrapper)
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4

      - name: Wrapper sanity check
        run: ./gradlew --version

      - name: Android Lint
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Lint summary
        if: always()
        run: |
          set +e
          f=app/build/reports/lint-results-debug.xml
          if [ -f "$f" ]; then
            echo "===== 按严重度统计 ====="
            grep -o 'severity="[^"]*"' "$f" | sort | uniq -c | sort -rn
            echo "===== 按规则 ID 统计 ====="
            grep -o 'id="[^"]*"' "$f" | sort | uniq -c | sort -rn | head -80
          fi
          exit 0

      - name: JVM unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Test summary
        if: always()
        run: |
          set +e
          d=app/build/test-results/testDebugUnitTest
          if [ -d "$d" ]; then
            echo "===== 用例统计（tests/skipped/failures/errors）====="
            grep -h -o 'tests="[0-9]*" skipped="[0-9]*" failures="[0-9]*" errors="[0-9]*"' "$d"/*.xml || true
          fi
          exit 0

      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quality-reports
          path: |
            app/build/reports/lint-results-debug.*
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn

  # ---------- 2. 构建 Debug / Release APK ----------
  build:
    name: Build APKs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Resolve preinstalled Android SDK
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK" ]; then echo "::error::Android SDK not found at $SDK"; exit 1; fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "sdk.dir=$SDK" > local.properties

      - name: Set up Gradle (from committed wrapper)
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4

      # 签名密钥只写入 runner 的临时目录，绝不落在工作区（旧实现在仓库根目录解码 keystore）
      - name: Decode keystore into RUNNER_TEMP
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set +e
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/hello-release.keystore"
            echo "HELLOWIDGET_KEYSTORE=$RUNNER_TEMP/hello-release.keystore" >> "$GITHUB_ENV"
            echo "HAS_KEYSTORE=1" >> "$GITHUB_ENV"
          else
            echo "HAS_KEYSTORE=0" >> "$GITHUB_ENV"
            echo "::warning::KEYSTORE_BASE64 不可用（fork PR / Dependabot）——本次只产出未签名 release 包"
          fi

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      # 有密钥 → 签名包；无密钥（fork PR）→ 未签名包，流程依然能通过
      - name: Build Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Clean up keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/hello-release.keystore" || true

      - name: APK evidence
        if: always()
        run: |
          set +e
          echo "===== APK 产物 ====="
          find app/build/outputs/apk -name '*.apk' -exec ls -la {} \;
          echo "===== APK 元数据 ====="
          BT="$(ls -d "$ANDROID_HOME"/build-tools/*/ 2>/dev/null | sort -V | tail -1)"
          for a in $(find app/build/outputs/apk -name '*.apk'); do
            echo "--- $a ---"
            "${BT}aapt2" dump badging "$a" 2>/dev/null | head -20
          done
          exit 0

      - name: Upload APKs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: apks
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: warn

  # ---------- 3. 仪器化测试（Android 模拟器） ----------
  # JVM/Robolectric 测不到「输入法到底有没有真的弹出来」这类行为，
  # 因此 v7.1 起在 CI 的模拟器上跑 androidTest；发布必须等它通过。
  instrumented:
    name: Instrumented Tests (emulator API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # v7.3：同时跑 API 34 与 API 35。API 35（Android 15）才会**由系统强制**边到边，
    # 而 34 上我们靠显式 enableEdgeToEdge() 得到等价行为 —— 两个都跑才能覆盖
    # 「强制边到边」这条平台行为差异（键盘 insets、系统栏、刘海）。
    strategy:
      fail-fast: false
      matrix:
        api-level: [ 34, 35 ]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Resolve preinstalled Android SDK
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK" ]; then echo "::error::Android SDK not found at $SDK"; exit 1; fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "sdk.dir=$SDK" > local.properties

      - name: Set up Gradle (from committed wrapper)
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4

      # GitHub 的 Linux runner 通过 KVM 提供硬件加速，必须放开 /dev/kvm 权限
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # enable-hw-keyboard=false：接了「硬件键盘」的设备系统不显示软键盘，
      # 本用例验证的正是软键盘，必须关掉（对应官方文档的 Note）。
      # target=default 用 AOSP 镜像：自带 AOSP 输入法，且没有 Gboard 首次启动弹窗干扰。
      #
      # v7.2：同一个 script 内先拉起仓库自带的零依赖 Python WebDAV 服务器
      # （.github/scripts/webdav_stub_server.py，只监听 127.0.0.1；模拟器通过 10.0.2.2 访问），
      # 再把地址通过 instrumentation 参数传给 WebDAV 端到端测试。
      # 服务器端会记录每个请求，测试据此断言「真的用了 HEAD/MKCOL/PUT/MOVE/COPY」
      # ——这是「支持 WebDAV」而不是「碰巧能传文件」的硬证据。
      - name: Run instrumented tests on emulator
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          target: default
          arch: x86_64
          disable-animations: true
          disable-spellchecker: true
          enable-hw-keyboard: false
          emulator-boot-timeout: 900
          # 编排全部收进脚本：emulator-runner 会把 script 的每一行当独立命令执行，
          # 变量/循环/续行都无法跨行生效，因此这里只留一行调用（脚本里用 bash 明确指定解释器）
          script: bash .github/scripts/run_webdav_e2e.sh

      - name: Instrumented test summary
        if: always()
        run: |
          set +e
          d=app/build/outputs/androidTest-results/connected
          if [ -d "$d" ]; then
            find "$d" -name '*.xml' -exec grep -H -o 'tests="[0-9]*" skipped="[0-9]*" failures="[0-9]*" errors="[0-9]*"' {} \;
          fi
          exit 0

      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: instrumented-reports
          path: |
            app/build/outputs/androidTest-results/
            app/build/reports/androidTests/
          if-no-files-found: warn

      # 顶部导航栏真实渲染图（含一张「高刘海」模拟图，复现 v7.7 事故条件）。
      # 容器里的像素断言已经证明「白色标题与图标真的被画出来」，截图用于人工复核。
      - name: Upload top bar screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: topbar-screenshots-api${{ matrix.api-level }}
          path: topbar-screenshots/
          if-no-files-found: warn

  # ---------- 4. 发布 Release（仅 main 分支 push） ----------
  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [ quality, build, instrumented ]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # tag / 标题全部从 gradle.properties 派生，不再手工维护
      # （旧实现把 v6.0.<run_number> 与中文标题硬编码在 workflow 里，每次发版手改）
      - name: Read version from gradle.properties
        id: ver
        run: |
          set -euo pipefail
          VERSION_NAME=$(sed -n 's/^hellowidget\.versionName=//p' gradle.properties | head -1 | tr -d '[:space:]')
          VERSION_CODE=$(sed -n 's/^hellowidget\.versionCode=//p' gradle.properties | head -1 | tr -d '[:space:]')
          if [ -z "$VERSION_NAME" ]; then echo "::error::无法从 gradle.properties 读取 hellowidget.versionName"; exit 1; fi
          echo "tag=v${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"

      - name: Download APKs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: apks
          path: dist

      - name: Verify release APK exists and is signed
        run: |
          set -euo pipefail
          ls -la dist
          APK=$(find dist -name 'app-release.apk' | head -1)
          if [ -z "$APK" ]; then echo "::error::未找到已签名的 app-release.apk（未签名包不能发布）"; exit 1; fi
          unzip -l "$APK" | grep -q 'META-INF/CERT' || { echo "::error::APK 未签名"; exit 1; }
          echo "release APK: $APK"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: HelloWidget v${{ steps.ver.outputs.version }}
          body: |
            ### 安装
            下载下方的 `app-release.apk` 直接安装（已签名，versionCode ${{ steps.ver.outputs.code }}）。

            完整改动见下方自动生成的 changelog。
          files: dist/**/*.apk
          generate_release_notes: true
          make_latest: true
