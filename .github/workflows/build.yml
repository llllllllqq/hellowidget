name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:      # 支持手动触发

permissions:
  contents: write         # 允许创建 GitHub Release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.5"

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > hello-release.keystore

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Build Release APK (signed)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-signed
          path: app/build/outputs/apk/release/app-release.apk

      # 推送 main 分支成功后，自动发布一个可下载的 Release（带签名 APK）
      - name: Create GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v5.5.${{ github.run_number }}
          name: HelloWidget v5.5（小部件整块可点击 + 多任务键Toast）· build ${{ github.run_number }}
          body: |
            ## 本版本改进
            ### 修复
            - **多任务键保存 Toast 不再丢失**：onUserLeaveHint 改为同步等待写盘完成后再弹 Toast，保证 Toast 在应用退后台之前发出（多任务切换比 Home 快，异步会错过时机）
            - **小部件整块可点击**（Android 12+）：改用 ScrollView 方案，TextView 填满整个小组件，点击任何位置（含空白）都能打开应用，长内容仍可原生滚动；不再使用 ListView 叠加层/整行方案（两者会破坏滚动或加载）
            - Android 5–11 保留 ListView 方案（可滚动，点击文字行打开应用）
            ### 历史功能
            - 包名 moe.hellowidget；返回键/Home 键保存 Toast
            - DataStore 官方原子写入 + CRC32 校验
            - 小组件外观设置（字体/颜色/背景）
            - 零后台占用
          files: app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
