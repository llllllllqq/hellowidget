name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:      # 支持手动触发

permissions:
  contents: write         # 允许创建 GitHub Release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.5"

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > hello-release.keystore

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Build Release APK (signed)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-signed
          path: app/build/outputs/apk/release/app-release.apk

      # 推送 main 分支成功后，自动发布一个可下载的 Release（带签名 APK）
      - name: Create GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v5.0.${{ github.run_number }}
          name: HelloWidget v5.0（原子写入 + CRC32 校验）· build ${{ github.run_number }}
          body: |
            ## 本版本改进
            - **DataStore 官方原子写入**：写临时文件 + fsync + 原子重命名，任意时刻崩溃都不会产生半个文件，内容永不损坏
            - **CRC32 校验和**：文件末尾内嵌 4 字节 CRC32，读取时校验；损坏时保留现场文件并自动重建
            - **保存时机**：仅在退出 / 返回 / 切后台时保存，不做编辑自动保存
            - **保存确认**：真正写盘成功后才提示「已保存 ✓」，失败提示「保存失败」且旧内容不受影响
            - **零后台占用**：保存完成即结束，无自动保存、无轮询、无后台任务，CPU 自动释放
            - 旧版 SharedPreferences 内容自动迁移
          files: app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
