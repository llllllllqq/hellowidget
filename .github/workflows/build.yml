name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:      # 支持手动触发

permissions:
  contents: write         # 允许创建 GitHub Release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.5"

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > hello-release.keystore

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Build Release APK (signed)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-signed
          path: app/build/outputs/apk/release/app-release.apk

      # 推送 main 分支成功后，自动发布一个可下载的 Release（带签名 APK）
      - name: Create GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v5.4.${{ github.run_number }}
          name: HelloWidget v5.4（修复 MIUI 小部件无法加载）· build ${{ github.run_number }}
          body: |
            ## 本版本改进
            ### 修复（重要）
            - **修复 MIUI 桌面上小部件无法加载**：移除对 ListView 自身的 setOnClickPendingIntent（该操作在部分桌面会导致整个小部件加载失败）
            - 空白区域点击改为**短内容单条填满**方案：内容 ≤3 行时合并为一条列表项、高度填满整个小组件，整块区域均可点击打开应用；长内容仍逐行渲染、正常上下滚动
            ### 历史功能
            - 包名 moe.hellowidget；返回键/Home/多任务键保存 Toast
            - DataStore 官方原子写入 + CRC32 校验
            - 桌面小组件可滚动 + 外观设置
            - 零后台占用
          files: app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
