# Project-wide Gradle settings.
# 3g：AGP 9 起资源收缩固定由 R8 承担（android.r8.optimizedResourceShrinking 默认 true），
# release 变体的内存占用比 AGP 8 更高。
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.parallel=true

# Android settings
# AGP 9 已把该项默认值翻成 true，这里保留显式声明（语义不变、便于阅读）。
android.useAndroidX=true
# 注意：不要开启 android.enableJetifier。
# 本项目依赖全部是 AndroidX，没有 support-library 遗留依赖，Jetifier 纯属多余开销；
# 而且它会对第三方 jar 做字节码改写，遇到 Java 21+ 的 class 文件会直接崩：
#   JetifyTransform ... Unsupported class file major version 65
# （已在 CI 中实测：加入 Robolectric 后 lint/单测任务因此失败）

# ---------------------------------------------------------------------------
# 版本号唯一来源：app/build.gradle.kts 从这里读取，CI 也从这里派生 Release tag。
# 发新版只需改这两行。
# ---------------------------------------------------------------------------
hellowidget.versionName=7.9.0
hellowidget.versionCode=27
